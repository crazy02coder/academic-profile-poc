<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Akademik İz</title>
  <script>
    // Tema, stil yüklenmeden seçilir; yoksa koyu temada beyaz bir an parlardı.
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) { /* tarayıcı depolamayı engellemiş olabilir */ }
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <a class="brand" href="#/">
      <span class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 3 9.5 16 16l13-6.5L16 3Z" fill="currentColor" opacity=".9"/><path d="M7 13.5v6.2c0 2.6 4 4.8 9 4.8s9-2.2 9-4.8v-6.2L16 18l-9-4.5Z" fill="currentColor" opacity=".55"/><path d="M27 10v8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
      <span class="brand-text"><b>Akademik İz</b><small>Araştırma keşif platformu</small></span>
    </a>

    <nav class="nav" id="nav" aria-label="Ana menü">
      <span class="nav-pill" id="navPill" aria-hidden="true"></span>
      <a href="#/" data-nav="home"><i data-icon="home"></i>Ana sayfa</a>
      <a href="#/akademisyenler" data-nav="akademisyenler"><i data-icon="users"></i>Akademisyenler<span class="count" id="cntProfiles"></span></a>
      <a href="#/universiteler" data-nav="universiteler"><i data-icon="building"></i>Üniversiteler</a>
      <a href="#/firmalar" data-nav="firmalar"><i data-icon="briefcase"></i>Firmalar</a>
      <a href="#/ara" data-nav="ara"><i data-icon="book"></i>Konular</a>
      <div class="nav-sep"></div>
      <a href="#/kutuphane" data-nav="kutuphane"><i data-icon="bookmark"></i>Kütüphanem<span class="count" id="cntLibrary"></span></a>
    </nav>

    <div class="side-foot">
      <a class="side-link" href="#/sistem" data-nav="sistem"><i data-icon="settings"></i>Ayarlar</a>
      <div class="env" id="env"><span class="dot"></span><span>Kontrol ediliyor…</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Menü"><i data-icon="menu"></i></button>
      <nav class="crumbs" id="crumbs" aria-label="Konum"></nav>
      <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Temayı değiştir">
        <span class="i-moon"><i data-icon="moon"></i></span><span class="i-sun"><i data-icon="sun"></i></span>
      </button>
    </header>
    <section id="view" class="view" tabindex="-1"></section>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button id="modalClose" class="icon-btn modal-x" type="button" aria-label="Kapat"><i data-icon="x"></i></button>
    <div id="modalBody"></div>
  </div>
</div>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div id="drawerTitle"></div>
    <button id="drawerClose" class="icon-btn" type="button" aria-label="Kapat"><i data-icon="x"></i></button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>

<div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
