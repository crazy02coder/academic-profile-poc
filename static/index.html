<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Akademik İz</title>
  <link rel="icon" href="/static/brand-mark.svg" type="image/svg+xml">
  <script>
    // Tema, stil yüklenmeden seçilir; yoksa koyu temada beyaz bir an parlardı.
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) { /* tarayıcı depolamayı engellemiş olabilir */ }
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=20261110-0702">
  <script src="/static/app.js?v=20261110-0702" defer></script>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <a class="brand" href="#/" aria-label="Akademik İz ana sayfa">
      <span class="mark"><img src="/static/brand-mark.svg" alt=""></span>
      <span class="brand-text"><b>Akademik İz</b><small>Araştırma keşif platformu</small></span>
    </a>

    <nav class="nav" id="nav" aria-label="Ana menü">
      <span class="nav-pill" id="navPill" aria-hidden="true"></span>
      <a href="#/" data-nav="home"><i data-icon="home"></i><span class="nav-label">Ana sayfa</span></a>
      <a href="#/akademisyenler" data-nav="akademisyenler"><i data-icon="users"></i><span class="nav-label">Akademisyenler</span><span class="count" id="cntProfiles"></span></a>
      <a href="#/universiteler" data-nav="universiteler"><i data-icon="building"></i><span class="nav-label">Üniversiteler</span></a>
      <a href="#/firmalar" data-nav="firmalar"><i data-icon="briefcase"></i><span class="nav-label">Firmalar</span></a>
      <a href="/kutuphane" target="_blank" rel="noopener" data-nav="library3d"><i data-icon="book"></i><span class="nav-label">Kütüphane</span></a>
      <div class="nav-sep"></div>
      <a href="#/kutuphane" data-nav="kutuphane"><i data-icon="bookmark"></i><span class="nav-label">Kütüphanem</span><span class="count" id="cntLibrary"></span></a>
    </nav>

    <div class="side-foot">
      <a class="side-link" href="#/sistem" data-nav="sistem"><i data-icon="settings"></i><span class="nav-label">Ayarlar</span></a>
      <div class="env" id="env"><span class="dot"></span><span>Kontrol ediliyor…</span></div>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Menüyü daralt" aria-controls="side" aria-expanded="true" title="Menüyü daralt"><i data-icon="menu"></i></button>
      <nav class="crumbs" id="crumbs" aria-label="Konum"></nav>
      <button class="icon-btn theme-btn" id="themeBtn" type="button" aria-label="Temayı değiştir">
        <span class="i-moon"><i data-icon="moon"></i></span><span class="i-sun"><i data-icon="sun"></i></span>
      </button>
    </header>
    <section id="view" class="view" tabindex="-1"></section>
  </main>
</div>

<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <button id="modalClose" class="icon-btn modal-x" type="button" aria-label="Kapat"><i data-icon="x"></i></button>
    <div id="modalBody"></div>
  </div>
</div>

<aside id="drawer" class="drawer" aria-hidden="true">
  <div class="drawer-head">
    <div id="drawerTitle"></div>
    <button id="drawerClose" class="icon-btn" type="button" aria-label="Kapat"><i data-icon="x"></i></button>
  </div>
  <div id="drawerBody" class="drawer-body"></div>
</aside>

<div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
